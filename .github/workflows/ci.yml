name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and Production Gate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: neighbour
          POSTGRES_USER: neighbour
          POSTGRES_PASSWORD: neighbour_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U neighbour -d neighbour"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://neighbour:neighbour_ci_password@localhost:5432/neighbour
      JWT_ACCESS_SECRET: ci-access-secret-that-is-at-least-thirty-two-characters
      JWT_REFRESH_SECRET: ci-refresh-secret-that-is-at-least-thirty-two-characters
      CORS_ORIGINS: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm production:check

      - run: pnpm --filter @neighbour/api db:generate

      - run: pnpm --filter @neighbour/api db:deploy

      - run: pnpm format:check

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm build
