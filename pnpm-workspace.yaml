packages:
  - 'apps/*'
  - 'services/*'
  - 'packages/*'

allowBuilds:
  '@prisma/engines': true
  '@swc/core': true
  argon2: true
  esbuild: true
  prisma: true
  sharp: false

catalog:
  typescript: ^5.9.2

minimumReleaseAgeExclude:
  - '@expo/cli@57.0.12 || 57.0.13 || 57.0.19'
  - '@expo/router-server@57.0.5 || 57.0.8'
  - expo-constants@57.0.9 || 57.0.15
  - expo-modules-core@57.0.9 || 57.0.10 || 57.0.14
  - expo@57.0.10 || 57.0.11 || 57.0.17
  - '@expo/config-plugins@57.0.7'
  - babel-preset-expo@57.0.6 || 57.0.9
  - expo-asset@57.0.9 || 57.0.15
  - expo-file-system@57.0.2 || 57.0.6
  - expo-image-manipulator@57.0.8 || 57.0.14
  - expo-image-picker@57.0.8 || 57.0.14
  - expo-location@57.0.8 || 57.0.14
  - '@expo/inline-modules@0.1.7'
  - '@expo/local-build-cache-provider@57.0.8'
  - '@expo/log-box@57.0.4'
  - '@expo/metro-config@57.0.11'
  - '@expo/prebuild-config@57.0.15'
  - expo-modules-autolinking@57.0.12
  - expo-modules-jsi@57.0.6
  - expo-dev-client@57.0.16
  - expo-dev-launcher@57.0.16
  - expo-dev-menu@57.0.16
  - expo-secure-store@57.0.2
  - expo-video@57.0.3
